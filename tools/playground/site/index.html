<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Hive Coworking: live demo</title>
	<meta name="description" content="A full-stack WordPress portfolio project: block theme and booking plugin, running in WordPress Playground.">
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 87'%3E%3Cpolygon points='25,0 75,0 100,43.5 75,87 25,87 0,43.5' fill='%23E8A317'/%3E%3C/svg%3E">
	<style>
		:root { color-scheme: light; --ink: #211b14; --paper: #fbf7ef; --shade: #f3ecdd; --line: #ddd3c2; --honey: #e8a317; --soft: #5e554a; }
		* { box-sizing: border-box; }
		html, body { height: 100%; margin: 0; }
		body { display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
		header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
		.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
		.mark { width: 22px; aspect-ratio: 1 / 0.866; background: var(--honey); clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
		.brand strong { font: 600 18px/1.2 Georgia, serif; }
		.brand span { color: var(--soft); font-size: 13px; }
		nav { display: flex; flex-wrap: wrap; gap: 8px; }
		nav a { padding: 7px 14px; border-radius: 999px; color: var(--ink); font-size: 14px; font-weight: 600; text-decoration: none; box-shadow: inset 0 0 0 1px var(--line); }
		nav a:hover, nav a:focus-visible { box-shadow: inset 0 0 0 2px var(--ink); outline: none; }
		nav a.primary { background: var(--honey); box-shadow: none; }
		main { position: relative; flex: 1; min-height: 520px; background: var(--shade); }
		.loading { position: absolute; inset: 0; display: grid; place-content: center; gap: 8px; padding: 16px; color: var(--soft); text-align: center; }
		.loading strong { color: var(--ink); font-size: 17px; }
		iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
	</style>
</head>
<body>
	<header>
		<div class="brand">
			<div class="mark" aria-hidden="true"></div>
			<div>
				<strong>Hive Coworking</strong><br>
				<span>WordPress portfolio project, running entirely in your browser</span>
			</div>
		</div>
		<nav aria-label="Project links">
			<a class="primary" href="https://playground.wordpress.net/?blueprint-url=__SITE_URL__/blueprint-admin.json" target="_blank" rel="noopener">Open the admin</a>
			<a href="https://github.com/YevhenTiutiunnyk/hive-coworking" target="_blank" rel="noopener">Source on GitHub</a>
			<a href="hive-core.zip">Plugin zip</a>
			<a href="hive.zip">Theme zip</a>
		</nav>
	</header>
	<main>
		<div class="loading" aria-hidden="true">
			<strong>Starting WordPress in your browser…</strong>
			<span>It takes about 15 seconds. You are logged in as a demo member: pick a slot and book it.</span>
		</div>
		<iframe
			title="Hive Coworking demo site"
			src="https://playground.wordpress.net/?mode=seamless&amp;blueprint-url=__SITE_URL__/blueprint.json"
			allow="clipboard-write"
		></iframe>
	</main>
</body>
</html>
